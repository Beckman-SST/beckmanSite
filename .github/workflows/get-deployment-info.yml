name: get-deployment-info

on:
  workflow_call:
    inputs:
      target_envs:
        type: string
        description: "Comma-separated list of regions to include (e.g., 'br')"
        required: false
        default: ""
      override-env:
        type: string
        description: "Env to Override"
        required: false
    outputs:
      matrix:
        description: "The environment matrix"
        value: ${{ jobs.build-matrix.outputs.matrix }}
      timestamp:
        description: "The current timestamp"
        value: ${{ jobs.build-matrix.outputs.timestamp }}
      deployment-targets:
        description: "Deployment target details for each environment"
        value: ${{ jobs.build-matrix.outputs.deployment-targets }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    env:
      TARGET_ENVS: ${{ inputs.target_envs }}
      OVERRIDE_ENV: ${{ inputs.override-env }}
      TARGETS: ${{ vars.TARGETS }}
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
      timestamp: ${{ steps.set_matrix.outputs.timestamp }}
      deployment-targets: ${{ steps.set_matrix.outputs.deployment-targets }}
    steps:
      - name: Set matrix using GitHub Script
        id: set_matrix
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = process.env.GITHUB_REF_NAME || 'default';
            const inputEnvs = process.env.TARGET_ENVS || '';
            const overrideEnv = process.env.OVERRIDE_ENV || '';

            // Parse TARGETS from Repo Variables
            const targetsJSON = process.env.TARGETS || '{}';
            let deploymentTargets = {};
            try {
              deploymentTargets = JSON.parse(targetsJSON);
              console.log('Successfully parsed TARGETS JSON from vars.');
            } catch (e) {
              console.error('Failed to parse TARGETS JSON:', e);
            }

            // Fallback for dev if not in vars (optional, but safer to rely on vars now)
            if (Object.keys(deploymentTargets).length === 0) {
                 console.log("No TARGETS var found, using fallback (might be outdated).");
                 deploymentTargets = {
                    dev: { 
                        'source-aws-env': 'us-east-1',
                        'domain': 'dev.beckmansst.com.br', 
                        'bucket-prefix': 'beckmansst-site-dev' 
                    }
                 };
            }

            let jsonMatrix = { include: [] };
            let timestamp = new Date().toISOString().replace(/[-:T.]/g, '').slice(0, 12);

            if (overrideEnv) {
                if (deploymentTargets[overrideEnv]) {
                    jsonMatrix.include.push({ env: overrideEnv, version: overrideEnv });
                    core.setOutput('matrix', JSON.stringify(jsonMatrix));
                    core.setOutput('timestamp', timestamp);
                    core.setOutput('deployment-targets', JSON.stringify({ [overrideEnv]: deploymentTargets[overrideEnv] }));
                    return;
                } else {
                     core.setFailed(`Override env '${overrideEnv}' not found in deployment targets.`);
                     return;
                }
            }

            if (branchName === 'main') {
               if (deploymentTargets['prod']) {
                   jsonMatrix.include.push({ env: 'prod', version: timestamp });
               }
            } else if (branchName === 'develop') {
               if (deploymentTargets['dev']) {
                   jsonMatrix.include.push({ env: 'dev', version: 'dev' });
               }
            }

            // Filter targets
            const filteredTargets = {};
            jsonMatrix.include.forEach(item => {
              if (deploymentTargets[item.env]) {
                filteredTargets[item.env] = deploymentTargets[item.env];
              }
            });

            core.setOutput('matrix', JSON.stringify(jsonMatrix));
            core.setOutput('timestamp', timestamp);
            core.setOutput('deployment-targets', JSON.stringify(deploymentTargets));
