name: Build and Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      override-env:
        description: "Override environment"
        required: false
        type: choice
        options:
          - ""
          - dev

permissions:
  id-token: write
  contents: read

env:
  AWS_ROLE_ARN_PATTERN: ${{ vars.AWS_ROLE_ARN_PATTERN || 'arn:aws:iam::712672311681:role/${env}-core-github-actions-role' }}

jobs:
  get-deployment-info:
    uses: ./.github/workflows/get-deployment-info.yml
    with:
      override-env: ${{ inputs.override-env || '' }}

  deploy:
    name: "Deploy ${{ needs.get-deployment-info.outputs.environment }}"
    runs-on: ubuntu-latest
    needs: get-deployment-info
    if: needs.get-deployment-info.outputs.matrix != '{"include":[]}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Env Vars & Targets
        id: env-vars
        env:
          TARGETS: ${{ needs.get-deployment-info.outputs.deployment-targets }}
          ENV: ${{ fromJson(needs.get-deployment-info.outputs.matrix).include[0].env }}
        run: |
          # Extract region and targets from JSON
          REGION=$(echo '$TARGETS' | jq -r --arg e "$ENV" '.[$e]["source-aws-env"] // "us-east-1"')
          BUCKET=$(echo '$TARGETS' | jq -r --arg e "$ENV" '.[$e]["s3-bucket"]')
          DIST_ID=$(echo '$TARGETS' | jq -r --arg e "$ENV" '.[$e]["cloudfront-distribution-id"]')

          ROLE_ARN="${AWS_ROLE_ARN_PATTERN//\$\{env\}/$ENV}"

          echo "aws-region=$REGION" >> "$GITHUB_OUTPUT"
          echo "aws-role-arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "s3-bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "cloudfront-id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env-vars.outputs.aws-role-arn }}
          aws-region: ${{ steps.env-vars.outputs.aws-region }}

      # Lookup step removed as we use TARGETS json

      - name: Upload to S3
        run: |
          # Sync current directory (excluding hidden) to S3
          aws s3 sync . "s3://${{ steps.env-vars.outputs.s3-bucket }}" --exclude ".git/*" --exclude ".github/*" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ steps.env-vars.outputs.cloudfront-id }}" --paths "/*"
